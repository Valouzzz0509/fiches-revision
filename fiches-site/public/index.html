<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mes fiches de révision</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Caveat:wght@600&display=swap" rel="stylesheet">
<meta name="theme-color" content="#2c43d0">
<style>
:root{--paper:#eef2fb;--sheet:#fff;--ink:#1b2559;--mute:#56618d;--grid:#dbe2f4;--margin:#e5574f;
--hl:rgba(255,222,89,.9);--pk:rgba(255,160,205,.7);--bl:rgba(130,195,255,.7);--postit:#fff3a8;
--acc:#2c43d0;--accink:#fff;--ok:#1f9d63;--ko:#d9443d;--m:20px;--pad:34px;color-scheme:light}
@media(min-width:640px){:root{--m:58px;--pad:82px}}
@media(prefers-color-scheme:dark){:root{--paper:#0d1230;--sheet:#161c42;--ink:#e8ecff;--mute:#9ba7d8;--grid:#272f64;--margin:#c9463f;
--hl:rgba(255,222,89,.32);--pk:rgba(255,130,190,.34);--bl:rgba(110,180,255,.34);--postit:#4a4420;--acc:#8da0ff;--accink:#0d1230;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:17px/1.5 "Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-text-size-adjust:100%}
main{max-width:780px;margin:0 auto;padding:max(26px,env(safe-area-inset-top)) 16px max(70px,env(safe-area-inset-bottom))}
h1{font-size:clamp(1.9rem,6.5vw,3rem);line-height:1.3;font-weight:800;letter-spacing:-.02em;margin:0 0 8px}
h1 span{background:linear-gradient(transparent 52%,var(--hl) 52%,var(--hl) 92%,transparent 92%);padding:0 .15em;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.sub{color:var(--mute);margin:0 0 26px;max-width:46ch}
.card{position:relative;background-color:var(--sheet);
background-image:linear-gradient(90deg,transparent calc(var(--m) - 1px),var(--margin) calc(var(--m) - 1px),var(--margin) calc(var(--m) + 1px),transparent calc(var(--m) + 1px)),repeating-linear-gradient(180deg,transparent 0,transparent 31px,var(--grid) 31px,var(--grid) 32px);
border-radius:8px;padding:26px 20px 26px var(--pad);margin-bottom:22px;line-height:32px;box-shadow:0 1px 0 var(--grid),0 16px 30px -22px rgba(27,37,89,.55)}
label{display:block;font-weight:700;font-size:.95rem;line-height:1.3;margin:0 0 8px}
textarea,input,select{width:100%;font:inherit;line-height:1.4;color:var(--ink);background:var(--sheet);border:1.5px solid var(--mute);border-radius:9px;padding:11px 12px}
textarea{min-height:90px;resize:vertical}
.row{display:flex;gap:14px;flex-wrap:wrap;margin-top:16px}
.row>*{flex:1 1 150px}
button{font:inherit;font-weight:700;border:0;border-radius:10px;padding:13px 18px;cursor:pointer;background:var(--acc);color:var(--accink);line-height:1.3}
button:hover{filter:brightness(1.08)}
button:disabled{opacity:.55;cursor:wait}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.drop{display:flex;flex-direction:column;align-items:center;gap:3px;width:100%;padding:24px 16px;background:var(--sheet);color:var(--ink);border:2px dashed var(--acc);border-radius:12px}
.drop b{font-size:1.2rem}.drop small{color:var(--mute);font-weight:500;font-size:.9rem}
.drop:hover{background:var(--hl);filter:none}
.thumbs{display:flex;gap:14px;flex-wrap:wrap;margin-top:14px}
.th{position:relative;width:74px;height:96px}
.th img{width:100%;height:100%;object-fit:cover;border-radius:6px;border:1px solid var(--grid);box-shadow:0 8px 16px -10px rgba(27,37,89,.6)}
.th .x{position:absolute;top:-9px;right:-9px;width:28px;height:28px;padding:0;border-radius:50%;background:var(--ink);color:var(--sheet);font-size:.8rem}
.tabs{display:flex;gap:4px;margin:6px 0 0;overflow-x:auto;padding-left:4px}
.tabs button{background:transparent;color:var(--mute);border:1.5px solid transparent;border-bottom:0;border-radius:10px 10px 0 0;padding:10px 20px}
.tabs button.on{background:var(--sheet);color:var(--ink);border-color:var(--grid)}
.tabs button:hover{filter:none;color:var(--ink)}
#fiche{border-top-left-radius:0;margin-top:0}
.fiche h2{font-size:1.7rem;line-height:1.2;font-weight:800;letter-spacing:-.015em;margin:0 0 10px}
.fiche h3{display:inline-block;font-size:1.08rem;line-height:1.35;font-weight:700;margin:20px 0 4px;background:linear-gradient(transparent 50%,var(--hl) 50%,var(--hl) 92%,transparent 92%);padding:0 .3em 0 .1em}
.fiche ul{margin:2px 0;padding-left:20px}.fiche li::marker{color:var(--acc)}
.kw{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.kw span{background:var(--hl);border-radius:4px;padding:0 11px;line-height:30px;font-weight:600;font-size:.92rem}
.kw span:nth-child(3n+2){background:var(--pk)}.kw span:nth-child(3n){background:var(--bl)}
.meta{color:var(--mute);font-size:.92rem;display:flex;justify-content:space-between;line-height:1.4}
.prog{height:10px;background:var(--grid);border-radius:9px;overflow:hidden;margin:8px 0 18px}
.prog i{display:block;height:100%;background:var(--ok);width:0;transition:width .4s}
.flash{margin:6px 0 14px}
.face{min-height:270px;display:flex;align-items:center;justify-content:center;text-align:center;padding:58px 26px 28px;
font-family:Caveat,"Bricolage Grotesque",cursive;font-weight:600;font-size:clamp(1.8rem,6vw,2.4rem);line-height:1.25;color:var(--ink);cursor:pointer;user-select:none;
background-color:var(--sheet);background-image:linear-gradient(transparent 43px,var(--margin) 43px,var(--margin) 45px,transparent 45px),repeating-linear-gradient(180deg,transparent 0,transparent 35px,var(--grid) 35px,var(--grid) 36px);
border:1px solid var(--grid);border-radius:10px;box-shadow:0 18px 34px -20px rgba(27,37,89,.65);transform:rotate(-.5deg)}
.face.back{background:var(--postit);transform:rotate(.6deg);animation:flip .3s ease}
@keyframes flip{from{transform:rotateX(70deg) scale(.96);opacity:.4}to{transform:rotate(.6deg);opacity:1}}
.hint{text-align:center;color:var(--mute);font-size:.92rem;margin:0 0 6px}
button.ok{background:var(--ok);color:#fff}button.ko{background:var(--ko);color:#fff}
.opt{display:block;width:100%;text-align:left;background:var(--sheet);color:var(--ink);border:2px solid var(--grid);margin:8px 0;line-height:1.4;font-weight:600}
.opt.good{background:var(--ok);border-color:var(--ok);color:#fff}.opt.bad{background:var(--ko);border-color:var(--ko);color:#fff}
#quiz h3{line-height:1.35;font-size:1.15rem}
.hist{margin-top:22px}
.hist button{background:var(--sheet);color:var(--ink);border:1.5px solid var(--mute);margin:0 8px 8px 0;padding:6px 14px;border-radius:99px;font-weight:600;font-size:.92rem}
.err{color:var(--ko);font-weight:600;line-height:1.4;margin-top:12px}
.hide{display:none}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.fh{margin:-6px 0 12px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:6px}
.chips span{font-size:.85rem;font-weight:700;line-height:26px;padding:0 12px;border-radius:99px;background:var(--acc);color:var(--accink)}
.chips span:not(:first-child){background:transparent;color:var(--mute);border:1.5px solid var(--grid)}
.fiche h2{font-size:clamp(1.8rem,6vw,2.4rem);line-height:1.15;margin:4px 0 6px}
.kwbox{background:var(--postit);border-radius:6px;padding:12px 16px 14px;margin:14px 0 20px;line-height:1.4;transform:rotate(-.4deg);box-shadow:0 12px 22px -16px rgba(27,37,89,.7)}
.kwbox strong{display:block;font-family:Caveat,cursive;font-size:1.4rem;margin-bottom:6px}
.kwbox .kw span{background:var(--sheet);border:1.5px solid var(--ink)}
.sec{--c:var(--bl);margin:0 0 18px;padding:2px 0 4px 16px;border-left:6px solid var(--c);border-radius:3px}
.sec.c1{--c:var(--pk)}.sec.c2{--c:var(--hl)}.sec.c3{--c:#9be3b8}
.sec h3{margin:0 0 2px;font-size:1.15rem;padding:0 .35em 0 .1em;background:linear-gradient(transparent 50%,var(--c) 50%,var(--c) 92%,transparent 92%)}
.sec ul{margin:4px 0 0;padding-left:18px}
.sec li{line-height:1.5;margin:0 0 6px;padding-left:2px}
.dl{display:flex;gap:10px;flex-wrap:wrap;margin-top:26px;border-top:2px dashed var(--grid);padding-top:18px;line-height:1.3}
.dl button{flex:1 1 200px}
button.ghost{background:transparent;color:var(--acc);border:2px solid var(--acc)}
#pr{display:none}
@media print{
  @page{margin:14mm}
  html,body{background:#fff!important}
  body.printing main{display:none!important}
  body.printing #pr{display:block;color:#1b2559;font:12pt/1.5 "Bricolage Grotesque",system-ui,sans-serif;color-scheme:light}
  body.printing #pr .card{box-shadow:none;background:#fff;background-image:none;padding:0;line-height:1.5}
  body.printing #pr{--sheet:#fff;--ink:#1b2559;--mute:#56618d;--grid:#dbe2f4;--hl:#ffe36b;--pk:#ffc2e0;--bl:#b9dcff;--postit:#fff3a8;--acc:#2c43d0;--accink:#fff}
  body.printing .sec,body.printing .kwbox,body.printing .pc{break-inside:avoid}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .pgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .pc{border:1.5px solid #1b2559;border-radius:8px;padding:10px 12px}
  .pc b{display:block;margin-bottom:6px}.pc span{color:#56618d}
  .prt{font-size:20pt;margin:0 0 12px}
}
</style>
</head>
<body>
<main>
  <h1><span>Mes fiches de révision</span></h1>
  <p class="sub">Prends ton cours en photo, l’IA fait la fiche et les cartes. Ensuite, tu révises en t’entraînant.</p>

  <section class="card" id="inp">
    <label>Ton cours en photo</label>
    <input type="file" id="pic" accept="image/*" multiple class="hide">
    <button class="drop" id="snap" type="button"><b>Photographier mon cours</b><small>Jusqu’à 5 pages, avec l’appareil photo ou depuis la galerie</small></button>
    <div id="thumbs" class="thumbs"></div>
    <label for="txt" style="margin-top:22px">Ou colle ton cours en texte (facultatif)</label>
    <textarea id="txt" style="min-height:90px" placeholder="Tu peux aussi coller du texte ici…"></textarea>
    <div class="row">
      <div><label for="mat">Matière</label><input id="mat" placeholder="Ex : Histoire, Bio, Droit…"></div>
      <div><label for="niv">Niveau</label>
        <select id="niv"><option>Collège</option><option>Lycée</option><option selected>Études supérieures</option></select></div>
    </div>
    <div class="row"><div><label for="code">Code d’accès</label><input id="code" type="password" placeholder="Code donné par le créateur du site"></div></div>
    <div class="row"><button id="go">Générer ma fiche</button></div>
    <div class="err" id="err"></div>
    <div class="hist" id="hist" style="margin-top:14px"></div>
  </section>

  <section id="res" class="hide">
    <div class="tabs" id="tabs">
      <button data-t="fiche" class="on">Fiche</button>
      <button data-t="cards">Cartes</button>
      <button data-t="quiz">Quiz</button>
    </div>
    <div id="fiche" class="card fiche"></div>
    <div id="cards" class="hide"></div>
    <div id="quiz" class="hide"></div>
  </section>
</main>

<script>
const $ = id => document.getElementById(id);
let deck = null, queue = [], known = 0, flipped = false, qi = 0, score = 0;

function store(){ try{ return JSON.parse(localStorage.getItem('fiches')||'[]') }catch(e){ return [] } }
function save(d){ try{ const l=store().filter(x=>x.title!==d.title); l.unshift(d); localStorage.setItem('fiches',JSON.stringify(l.slice(0,12))) }catch(e){} renderHist(); }
function renderHist(){
  const h=$('hist'); h.textContent='';
  const l=store(); if(!l.length) return;
  const t=document.createElement('label'); t.textContent='Mes fiches enregistrées'; h.appendChild(t);
  l.forEach(d=>{ const b=document.createElement('button'); b.textContent=d.title; b.onclick=()=>show(d); h.appendChild(b); });
}
function el(tag,txt,cls){ const e=document.createElement(tag); if(txt!=null) e.textContent=txt; if(cls) e.className=cls; return e; }

let photos=[];
function b64(bl){return new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result.split(',')[1]);f.readAsDataURL(bl)})}
try{window.addEventListener('DOMContentLoaded',()=>{$('code').value=localStorage.getItem('code')||''})}catch(e){}
async function shrink(file){
  const bm=await createImageBitmap(file); const k=Math.min(1,1400/Math.max(bm.width,bm.height));
  const cv=document.createElement('canvas'); cv.width=Math.round(bm.width*k); cv.height=Math.round(bm.height*k);
  cv.getContext('2d').drawImage(bm,0,0,cv.width,cv.height);
  return new Promise(r=>cv.toBlob(r,'image/jpeg',0.7));
}
function drawThumbs(){
  const t=$('thumbs'); t.textContent='';
  photos.forEach((p,i)=>{
    const w=el('div',null,'th'), im=document.createElement('img'), x=el('button','✕','x');
    im.src=URL.createObjectURL(p); im.alt='Page '+(i+1);
    x.type='button'; x.setAttribute('aria-label','Retirer la page '+(i+1));
    x.onclick=()=>{photos.splice(i,1);drawThumbs()};
    w.append(im,x); t.appendChild(w);
  });
}
$('snap').onclick=()=>$('pic').click();
$('pic').onchange=async e=>{
  $('err').textContent='';
  for(const f of e.target.files){
    if(photos.length>=5){ $('err').textContent='5 photos maximum par fiche.'; break; }
    try{ photos.push(await shrink(f)); }catch(x){ $('err').textContent='Impossible de lire une des photos.'; }
  }
  e.target.value=''; drawThumbs();
};

$('go').onclick = async () => {
  const text = $('txt').value.trim();
  $('err').textContent='';
  if(!photos.length && text.length<80){ $('err').textContent='Ajoute une photo de ton cours (ou colle un peu de texte).'; return; }
  const btn=$('go'); btn.disabled=true; btn.textContent='L’IA travaille…';
  try{
    const code=$('code').value.trim();
    try{localStorage.setItem('code',code)}catch(x){}
    const imgs=await Promise.all(photos.map(b64));
    const r=await fetch('/api/generate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({text:text.slice(0,12000),images:imgs,matiere:$('mat').value,niveau:$('niv').value,code})});
    const d=await r.json().catch(()=>({error:'Réponse invalide du serveur.'}));
    if(!r.ok) throw new Error(d.error||'Erreur serveur');
    if(!d || !d.sections || !d.cards) throw new Error('Réponse inattendue, réessaie.');
    d.matiere=$('mat').value.trim(); d.niveau=$('niv').value; save(d); show(d);
  }catch(e){
    $('err').textContent = (e && e.code==='not_granted') ? 'Autorisation refusée : accepte l’accès à Claude pour générer la fiche.' : (e && e.message) || 'Erreur, réessaie.';
  }
  btn.disabled=false; btn.textContent='Générer ma fiche';
};

function show(d){
  deck=d; $('res').classList.remove('hide');
  const f=$('fiche'); f.textContent='';
  const head=el('header',null,'fh');
  const chips=el('div',null,'chips');
  if(d.matiere) chips.appendChild(el('span',d.matiere));
  if(d.niveau) chips.appendChild(el('span',d.niveau));
  chips.appendChild(el('span',new Date().toLocaleDateString('fr-FR',{day:'numeric',month:'long',year:'numeric'})));
  head.append(chips, el('h2',d.title));
  f.appendChild(head);
  if(d.keywords&&d.keywords.length){
    const kb=el('div',null,'kwbox'); kb.appendChild(el('strong','À retenir'));
    const k=el('div',null,'kw'); d.keywords.forEach(w=>k.appendChild(el('span',w))); kb.appendChild(k); f.appendChild(kb);
  }
  (d.sections||[]).forEach((s,i)=>{
    const sec=el('section',null,'sec c'+(i%4));
    sec.appendChild(el('h3',s.heading));
    const ul=el('ul'); (s.points||[]).forEach(p=>ul.appendChild(el('li',p))); sec.appendChild(ul);
    f.appendChild(sec);
  });
  const bar=el('div',null,'dl noprint');
  const b1=el('button','Télécharger la fiche (PDF)'); b1.onclick=()=>printMode('fiche');
  const b2=el('button','Télécharger les cartes (PDF)','ghost'); b2.onclick=()=>printMode('cards');
  bar.append(b1,b2); f.appendChild(bar);
  startCards(); startQuiz(); tab('fiche');
  $('res').scrollIntoView({behavior:'smooth'});
}

function printMode(mode){
  let pr=$('pr'); if(!pr){ pr=el('div'); pr.id='pr'; document.body.appendChild(pr); }
  pr.textContent='';
  if(mode==='fiche'){
    pr.appendChild($('fiche').cloneNode(true));
    pr.querySelectorAll('.noprint').forEach(n=>n.remove());
  }else{
    pr.appendChild(el('h2',deck.title+' – cartes mémo','prt'));
    const g=el('div',null,'pgrid');
    (deck.cards||[]).forEach(c=>{ const x=el('div',null,'pc'); x.appendChild(el('b',c.q)); x.appendChild(el('span',c.a)); g.appendChild(x); });
    pr.appendChild(g);
  }
  const old=document.title; document.title=(deck.title||'fiche').replace(/[\\/:*?"<>|]/g,'')+(mode==='cards'?' - cartes':'');
  document.body.classList.add('printing');
  const done=()=>{document.body.classList.remove('printing');document.title=old;window.removeEventListener('afterprint',done)};
  window.addEventListener('afterprint',done);
  setTimeout(()=>window.print(),60);
}

function tab(t){
  ['fiche','cards','quiz'].forEach(x=>{ $(x).classList.toggle('hide',x!==t); });
  document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.t===t));
}
$('tabs').onclick = e => { if(e.target.dataset.t) tab(e.target.dataset.t); };

function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]} return a; }

function startCards(){ queue=shuffle(deck.cards||[]); known=0; flipped=false; drawCard(); }
function drawCard(){
  const c=$('cards'); c.textContent='';
  const total=(deck.cards||[]).length;
  if(!queue.length){
    const box=el('div',null,'card'); box.appendChild(el('h2','🎉 Bravo !'));
    box.appendChild(el('p','Tu as passé toutes les cartes. Recommence pour consolider.'));
    const b=el('button','Recommencer'); b.onclick=startCards; box.appendChild(b); const d2=el('button','Télécharger les cartes (PDF)','ghost'); d2.style.marginLeft='8px'; d2.onclick=()=>printMode('cards'); box.appendChild(d2); c.appendChild(box); return;
  }
  const m=el('div',null,'meta'); m.appendChild(el('span',`${known} / ${total} sues`)); m.appendChild(el('span',`${queue.length} restantes`)); c.appendChild(m);
  const p=el('div',null,'prog'); const i=el('i'); i.style.width=(total?known/total*100:0)+'%'; p.appendChild(i); c.appendChild(p);
  const fl=el('div',null,'flash'); const face=el('div',queue[0].q,'face'); fl.appendChild(face); c.appendChild(fl);
  c.appendChild(el('p','Touche la carte pour voir la réponse','hint'));
  const r=el('div',null,'row'); r.classList.add('hide');
  const ko=el('button','🔁 À revoir','ko'), ok=el('button','✅ Je savais','ok');
  ko.onclick=()=>{ queue.push(queue.shift()); flipped=false; drawCard(); };
  ok.onclick=()=>{ queue.shift(); known++; flipped=false; drawCard(); };
  r.append(ko,ok); c.appendChild(r);
  face.onclick=()=>{ flipped=!flipped; face.textContent=flipped?queue[0].a:queue[0].q; face.classList.toggle('back',flipped); r.classList.toggle('hide',!flipped); };
}

function startQuiz(){ qi=0; score=0; drawQ(); }
function drawQ(){
  const c=$('quiz'); c.textContent=''; const qs=deck.quiz||[];
  if(!qs.length){ c.appendChild(el('div','Pas de quiz pour cette fiche.','card')); return; }
  if(qi>=qs.length){
    const box=el('div',null,'card'); box.appendChild(el('h2',`Score : ${score} / ${qs.length}`));
    const b=el('button','Refaire le quiz'); b.onclick=startQuiz; box.appendChild(b); c.appendChild(box); return;
  }
  const q=qs[qi], box=el('div',null,'card');
  box.appendChild(el('div',`Question ${qi+1} / ${qs.length}`,'meta'));
  box.appendChild(el('h3',q.q)).style.margin='8px 0';
  const fb=el('p',''); let done=false;
  const opts=[];
  q.options.forEach((o,i)=>{
    const b=el('button',o,'opt'); opts.push(b);
    b.onclick=()=>{ if(done) return; done=true;
      if(i===q.answer){score++; b.classList.add('good'); fb.textContent='✅ Exact ! '+(q.why||'');}
      else{ b.classList.add('bad'); opts[q.answer].classList.add('good'); fb.textContent='❌ Pas tout à fait. '+(q.why||''); }
      const n=el('button','Suivant →'); n.onclick=()=>{qi++;drawQ()}; box.appendChild(n); };
    box.appendChild(b);
  });
  box.appendChild(fb); c.appendChild(box);
}

renderHist();
</script>
</body>
</html>
