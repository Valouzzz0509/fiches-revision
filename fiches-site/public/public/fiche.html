<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ma fiche – Carnet</title>
<meta name="theme-color" content="#2c43d0">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Caveat:wght@600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="site-header"></div>

<main class="wrap narrow">
  <p class="crumbs"><a href="fiches.html">‹ Mes fiches</a></p>

  <div id="missing" class="card plain empty hide">
    <h2>Fiche introuvable</h2>
    <p>Elle a peut-être été supprimée, ou elle a été créée sur un autre appareil.</p>
    <a class="btn" href="fiches.html">Voir mes fiches</a>
  </div>

  <div id="view" class="hide">
    <div class="tabs" id="tabs" role="tablist">
      <button data-t="fiche" class="on" role="tab">Fiche</button>
      <button data-t="cards" role="tab">Cartes</button>
      <button data-t="quiz" role="tab">Quiz</button>
    </div>
    <div id="fiche"></div>
    <div id="cards" class="hide"></div>
    <div id="quiz" class="hide"></div>
    <div class="danger"><button type="button" id="del">Supprimer cette fiche</button></div>
  </div>
</main>

<div id="site-footer"></div>
<script src="common.js"></script>
<script>
chrome('fiches');
const id=new URLSearchParams(location.search).get('id');
const deck=id&&Store.get(id);
let queue=[],known=0,flipped=false,qi=0,score=0;

if(!deck){ $('missing').classList.remove('hide'); }
else{
  document.title=deck.title+' – Carnet';
  $('view').classList.remove('hide');
  $('fiche').appendChild(buildFiche(deck,true,m=>printDeck(deck,m)));
  startCards(); startQuiz();
  const h=location.hash.replace('#','');
  tab(['cards','quiz'].includes(h)?h:'fiche');

  let armed=false;
  $('del').onclick=()=>{
    if(!armed){ armed=true; $('del').textContent='Confirmer la suppression'; $('del').style.color='var(--ko)'; return; }
    Store.remove(deck.id); location.href='fiches.html';
  };
}

function tab(t){
  ['fiche','cards','quiz'].forEach(x=>$(x).classList.toggle('hide',x!==t));
  document.querySelectorAll('#tabs button').forEach(b=>{const on=b.dataset.t===t;b.classList.toggle('on',on);b.setAttribute('aria-selected',on)});
}
$('tabs').onclick=e=>{ if(e.target.dataset.t) tab(e.target.dataset.t); };

/* ---- cartes mémo ---- */
function startCards(){ queue=shuffle(deck.cards||[]); known=0; flipped=false; drawCard(); }
function drawCard(){
  const c=$('cards'); c.textContent='';
  const total=(deck.cards||[]).length;
  if(!total){ c.appendChild(el('div','Cette fiche n’a pas de cartes.','card plain')); return; }
  if(!queue.length){
    const box=el('div',null,'card plain'); box.appendChild(el('h2','Bravo, tu as tout passé en revue !'));
    box.appendChild(el('p','Recommence pour consolider, ou télécharge les cartes pour les imprimer.'));
    const row=el('div',null,'cta');
    const b=el('button','Recommencer'); b.onclick=startCards;
    const d2=el('button','Télécharger les cartes (PDF)','ghost'); d2.onclick=()=>printDeck(deck,'cards');
    row.append(b,d2); box.appendChild(row); c.appendChild(box); return;
  }
  const m=el('div',null,'meta2'); m.appendChild(el('span',known+' / '+total+' sues')); m.appendChild(el('span',queue.length+' restantes')); c.appendChild(m);
  const p=el('div',null,'prog'); const i=el('i'); i.style.width=(known/total*100)+'%'; p.appendChild(i); c.appendChild(p);
  const fl=el('div',null,'flash'); const face=el('button',queue[0].q,'face'); face.type='button'; fl.appendChild(face); c.appendChild(fl);
  c.appendChild(el('p','Touche la carte pour voir la réponse','hint'));
  const r=el('div',null,'row'); r.classList.add('hide');
  const ko=el('button','À revoir','ko'), ok=el('button','Je savais','ok');
  ko.onclick=()=>{ queue.push(queue.shift()); flipped=false; drawCard(); };
  ok.onclick=()=>{ queue.shift(); known++; flipped=false; drawCard(); };
  r.append(ko,ok); c.appendChild(r);
  face.onclick=()=>{ flipped=!flipped; face.textContent=flipped?queue[0].a:queue[0].q; face.classList.toggle('back',flipped); r.classList.toggle('hide',!flipped); };
}

/* ---- quiz ---- */
function startQuiz(){ qi=0; score=0; drawQ(); }
function drawQ(){
  const c=$('quiz'); c.textContent=''; const qs=deck.quiz||[];
  if(!qs.length){ c.appendChild(el('div','Cette fiche n’a pas de quiz.','card plain')); return; }
  if(qi>=qs.length){
    const box=el('div',null,'card plain'); box.appendChild(el('h2','Score : '+score+' / '+qs.length));
    box.appendChild(el('p',score===qs.length?'Sans faute !':'Relis les parties où tu t’es trompé, puis refais le quiz.'));
    const b=el('button','Refaire le quiz'); b.onclick=startQuiz; box.appendChild(b); c.appendChild(box); return;
  }
  const q=qs[qi], box=el('div',null,'card plain');
  box.appendChild(el('div','Question '+(qi+1)+' / '+qs.length,'meta2'));
  const h=el('h3',q.q); h.style.margin='8px 0'; box.appendChild(h);
  const fb=el('p',''); let done=false; const opts=[];
  q.options.forEach((o,i)=>{
    const b=el('button',o,'opt'); b.type='button'; opts.push(b);
    b.onclick=()=>{ if(done) return; done=true;
      if(i===q.answer){score++; b.classList.add('good'); fb.textContent='Exact. '+(q.why||'');}
      else{ b.classList.add('bad'); if(opts[q.answer]) opts[q.answer].classList.add('good'); fb.textContent='Pas tout à fait. '+(q.why||''); }
      const n=el('button','Suivant'); n.onclick=()=>{qi++;drawQ()}; box.appendChild(n); };
    box.appendChild(b);
  });
  box.appendChild(fb); c.appendChild(box);
}
</script>
</body>
</html>
